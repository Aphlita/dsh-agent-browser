# dsh-agent-browser 的 Loader 行。
# bundle 渠道安装时由 dsh plugin add 自动追加；手工安装时把下面这行插进
# profile 的 cordis.patch.yml（与其它 insert 项并列）。
- insert:
    - id: agent-browser
      name: 'dsh-agent-browser'
      config:
        # 传输：默认 pipe（CDP over stdio，不监听任何 TCP 端口）；
        # 某些受限环境不兼容时改 "ws" 回退到 localhost 调试端口。
        transport: pipe
        # 嵌入模式：浏览器就是右侧栏里的一个 <webview>（Electron 原生渲染，零帧流、零延迟）。
        # 需要桌面端打过 webviewTag 补丁；默认 false = 像素流。
        # 设为 true 时也不是无条件启用：客户端连接后会先上报 capability，
        # 只有确认支持 <webview> 才切换，否则保持像素流（见 lib/index.js 的 capability 处理）。
        embedded: false
        # 原生窗口模式（独立 Chrome 窗口 + 右栏控制台）：和 embedded 二选一。
        nativeWindow: false
        # 域名策略：allowedHosts 为空 = 不限制；blockedHosts 优先。
        allowedHosts: []
        blockedHosts: []
        # 审批：false = 每次都要右栏批准（推荐）；true = 预批准、不再打断。
        approveUploads: false
        approveDangerousNavigate: false
        # 自定义脱敏正则（会替换成 [REDACTED:custom-N]），在默认规则之外追加。
        redactPatterns: []
        # 镜像帧率（原生窗口模式下只有点开「实时镜像」才出帧，默认 6fps 够看）。
        mirrorFps: 6
        # 兜底视口：嵌入模式下 <webview> 用面板真实尺寸；这两个值只影响像素流模式。
        viewportWidth: 1280
        viewportHeight: 800
        autoViewport: true
        headless: true
        frameQuality: 60
        # 画面静止 hdIdleMs 后补一张按 devicePixelRatio 抓的高清帧（高分屏不发糊）。
        hdOnIdle: true
        hdQuality: 80
        hdIdleMs: 400
        maxFps: 30
        # browser_eval 默认关闭（安全默认）。需要时改 allowEval: true 后重启；
        # 每次执行仍会在右栏弹窗审批并写 audit.jsonl。
        allowEval: false
        evalTimeoutMs: 60000