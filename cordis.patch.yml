# dsh-agent-browser 的 Loader 行。
# bundle 渠道安装时由 dsh plugin add 自动追加；手工安装时把下面这行插进
# profile 的 cordis.patch.yml（与其它 insert 项并列）。
- insert:
    - id: agent-browser
      name: 'dsh-agent-browser'
      config:
        # 原生窗口模式：浏览器跑在独立原生窗口里，人直接操作 = 零像素流延迟；
        # 侧栏变成控制台（地址栏/标签/租约/审计），需要时再打开实时镜像。
        nativeWindow: true
        # 镜像帧率（只有在右栏打开「实时镜像」时才出帧，默认 6fps 够看）。
        mirrorFps: 6
        # 兜底视口：原生窗口模式下由真实窗口决定；autoViewport 只影响像素流模式。
        viewportWidth: 1280
        viewportHeight: 800
        autoViewport: true
        headless: false
        frameQuality: 60
        # 画面静止 hdIdleMs 后补一张按 devicePixelRatio 抓的高清帧（高分屏不发糊）。
        hdOnIdle: true
        hdQuality: 80
        hdIdleMs: 400
        maxFps: 30
        # browser_eval 默认关闭（安全默认）。需要时改 allowEval: true 后重启；
        # 每次执行仍会在右栏弹窗审批并写 audit.jsonl。
        allowEval: false
        evalTimeoutMs: 60000